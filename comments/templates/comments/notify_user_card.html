<div class="card border mb-3 shadow-sm" id="notify-users-card">
  <div class="card-header bg-light py-2 d-flex justify-content-between align-items-center">
    <div class="form-check m-0">
      <input class="form-check-input" type="checkbox" id="selectAllNotifyUsers" onchange="toggleAllNotifyUsers(this)">
      <label class="form-check-label fw-bold text-secondary small" for="selectAllNotifyUsers">
        Уведомить участников модуля по Email
      </label>
    </div>
    <span class="badge bg-secondary rounded-pill small">{{ notify_users|length }}</span>
  </div>
  <div class="card-body p-2" style="max-height: 180px; overflow-y: auto;">
    {% if notify_users %}
      <div class="list-group list-group-flush small">
        {% for u in notify_users %}
          <label class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-1 px-2 border-0">
            <input class="form-check-input flex-shrink-0 mt-0 notify-user-checkbox" 
                   type="checkbox" 
                   name="comment_notify_users" 
                   value="{{ u.pk }}">
            <div class="d-flex flex-column text-truncate">
              <span class="fw-semibold text-dark text-truncate">
                {{ u.get_full_name|default:u.username }}
              </span>
              {% if u.email %}
                <span class="text-muted text-truncate" style="font-size: 0.75rem;">{{ u.email }}</span>
              {% endif %}
            </div>
          </label>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-muted small mb-0 px-2">Нет доступных участников для уведомления</p>
    {% endif %}
  </div>
</div>

<script>
  function toggleAllNotifyUsers(source) {
    var checkboxes = document.querySelectorAll('.notify-user-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].checked = source.checked;
    }
  }
</script>
