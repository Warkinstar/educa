{% extends "base.html" %}

{% block title %}Доступ к тесту ограничен{% endblock title %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white d-flex align-items-center gap-2">
        <i class="bi bi-shield-lock-fill fs-5"></i>
        <span class="fw-semibold">Доступ к тесту ограничен</span>
      </div>
      <div class="card-body">
        <h5 class="card-title mb-3">{{ obj.title }}</h5>
        <div class="alert alert-warning mb-4" role="alert">
          <i class="bi bi-lock-fill me-1"></i> {{ reason }}
        </div>
        <div class="d-flex gap-2">
          {% if course and has_course_access %}
            <a href="{% url 'student_course_detail' course.pk %}" class="btn btn-primary">
              <i class="bi bi-arrow-left"></i> Вернуться к курсу
            </a>
          {% endif %}
          <a href="{% url 'student_course_list' %}" class="btn btn-outline-secondary">
            Мои курсы
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
