{% load crispy_forms_tags %}
{{ tinymce_config|json_script:"tinymce-config-data" }}

<form id="content-block-form"
      method="post"
      hx-post="{% if object %}{% url 'module_content_update' module.id model_name object.id %}{% else %}{% url 'module_content_create' module.id model_name %}{% endif %}"
      hx-target="#modal-body-content-block"
      hx-encoding="multipart/form-data"
      novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger mb-3 shadow-sm" role="alert">
      {% for err in form.non_field_errors %}
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ err }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {{ form|crispy }}
  <div class="modal-footer px-0 pb-0 mt-4 border-top pt-3 d-flex justify-content-between">
    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Отмена</button>
    <button type="submit" class="btn btn-primary px-4">
      <i class="bi bi-check2-circle me-1"></i>Сохранить материал
    </button>
  </div>
</form>

<script>
  (function() {
    // 1. Инициализация выбора даты
    if (typeof flatpickr !== 'undefined') {
      flatpickr("#modal-body-content-block input[type='datetime-local'], #modal-body-content-block .datetimeinput, #modal-body-content-block input[name='deadline']", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true
      });
    }

    // 2. Инициализация TinyMCE строго для htmltext внутри модалки
    {% if model_name == 'htmltext' %}
      if (typeof tinymce !== 'undefined') {
        if (tinymce.get('id_content')) {
          tinymce.get('id_content').remove();
        }
        tinymce.remove('#modal-body-content-block textarea');

        var baseConfig = {};
        var configScript = document.getElementById('tinymce-config-data');
        if (configScript) {
          try {
            baseConfig = JSON.parse(configScript.textContent);
          } catch (e) {}
        }

        var uploadUrl = "{% url 'upload_image' module.id %}";
        var tinymceConfig = Object.assign({}, baseConfig, {
          selector: '#modal-body-content-block #id_content',
          images_upload_url: uploadUrl,
          automatic_uploads: true,
          images_upload_handler: function(blobInfo, success, failure) {
            var formData = new FormData();
            formData.append('file', blobInfo.blob(), blobInfo.filename());
            fetch(uploadUrl, {
              method: 'POST',
              headers: {
                'X-CSRFToken': '{{ csrf_token }}'
              },
              body: formData,
              credentials: 'same-origin'
            })
            .then(function(response) {
              return response.json().then(function(data) {
                return { ok: response.ok, status: response.status, data: data };
              }).catch(function() {
                return { ok: false, status: response.status, data: {} };
              });
            })
            .then(function(result) {
              if (result.ok && result.data && result.data.location) {
                success(result.data.location);
              } else {
                var errMsg = (result.data && result.data.error && result.data.error.message)
                  || (result.data && result.data.message)
                  || (result.data && typeof result.data.error === 'string' && result.data.error)
                  || ('Ошибка загрузки файла (HTTP ' + result.status + ')');
                failure(errMsg);
              }
            })
            .catch(function(err) {
              failure('Ошибка сети при загрузке изображения: ' + err.message);
            });
          },
          setup: function(editor) {
            editor.on('init change keyup input NodeChange Undo Redo', function() {
              editor.save();
            });
          }
        });
        tinymce.init(tinymceConfig);

        var form = document.getElementById('content-block-form');
        if (form) {
          form.addEventListener('htmx:configRequest', function(evt) {
            var ed = tinymce.get('id_content');
            if (ed) {
              ed.save();
              evt.detail.parameters['content'] = ed.getContent();
            }
          });
        }
      }
    {% endif %}
  })();
</script>
