{% load crispy_forms_tags %}

{{ form.media }}

<form id="content-block-form"
      method="post"
      hx-post="{% if object %}{% url 'module_content_update' module.id model_name object.id %}{% else %}{% url 'module_content_create' module.id model_name %}{% endif %}"
      hx-target="#modal-body-content-block"
      hx-encoding="multipart/form-data"
      novalidate>
  {% csrf_token %}

  {% if form.non_field_errors %}
    <div class="alert alert-danger mb-3 shadow-sm" role="alert">
      {% for err in form.non_field_errors %}
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ err }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {{ form|crispy }}

  <div class="modal-footer px-0 pb-0 mt-4 border-top pt-3 d-flex justify-content-between">
    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Отмена</button>
    <button type="submit" class="btn btn-primary px-4">
      <i class="bi bi-check2-circle me-1"></i>Сохранить материал
    </button>
  </div>
</form>

<script>
  (function() {
    if (typeof flatpickr !== 'undefined') {
      flatpickr("#modal-body-content-block input[type='datetime-local'], #modal-body-content-block .datetimeinput", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true
      });
    }

    if (typeof tinymce !== 'undefined') {
      tinymce.remove('#id_content');
      tinymce.init({
        selector: '#id_content',
        images_upload_url: "{% url 'upload_image' module.id %}",
        plugins:
          'textcolor save link preview codesample contextmenu table code lists'
          + ' fullscreen insertdatetime nonbreaking contextmenu directionality'
          + ' searchreplace wordcount visualblocks visualchars code fullscreen'
          + ' autolink lists charmap print hr anchor pagebreak spellchecker',
        toolbar1:
          'fullscreen preview bold italic underline | fontselect, fontsizeselect |'
          + ' forecolor backcolor | alignleft alignright | aligncenter'
          + ' alignjustify | indent outdent | bullist numlist table | link image'
          + ' media | codesample',
        height: 400,
        relative_urls: false,
        remove_script_host: false,
        setup: function (editor) {
          editor.on('change keyup', function () {
            editor.save();
          });
        },
      });
    }

    if (typeof Quill !== 'undefined') {
      const targetTextarea = document.querySelector("#modal-body-content-block textarea[name='instruction'], #modal-body-content-block textarea[name='description'], #modal-body-content-block #id_instruction, #modal-body-content-block #id_description");
      const quillContainer = document.querySelector("#modal-body-content-block #quill-editor");

      if (quillContainer && targetTextarea) {
        // Очищаем старые тулбары при повторном открытии модалки
        const prevToolbar = quillContainer.parentElement.querySelector('.ql-toolbar');
        if (prevToolbar) {
          prevToolbar.remove();
        }
        quillContainer.innerHTML = targetTextarea.value || '';

        const quill = new Quill(quillContainer, {
          theme: 'snow',
          modules: {
            toolbar: [
              ['bold', 'italic', 'underline', 'strike'],
              ['blockquote', 'code-block'],
              [{ 'list': 'ordered'}, { 'list': 'bullet' }],
              ['link', 'clean']
            ]
          }
        });

        quill.on('text-change', function() {
          targetTextarea.value = quill.root.innerHTML;
        });

        const form = document.getElementById('content-block-form');
        if (form) {
          form.addEventListener('submit', function() {
            targetTextarea.value = quill.root.innerHTML;
          });
        }
      }
    }
  })();

  })();
</script>
