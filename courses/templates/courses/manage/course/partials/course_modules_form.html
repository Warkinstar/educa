<form hx-post="{% url 'course_modal_modules' course.pk %}"
      hx-target="#modal-body-modules-course"
      hx-indicator="#modules-save-spinner">
    {% csrf_token %}
    {{ formset.management_form }}

    <div id="manage-modules-container">
        {% for form in formset %}
            {% include "courses/manage/course/partials/module_form_row.html" with form=form modules_prefix="manage_modules" %}
        {% endfor %}
    </div>

    <div class="mt-2 mb-3">
        <button type="button"
                class="btn btn-sm btn-outline-primary"
                hx-get="{% url 'course_module_add_row' %}?modules_prefix=manage_modules"
                hx-include="[name='manage_modules-TOTAL_FORMS']"
                hx-target="#manage-modules-container"
                hx-swap="beforeend">
            <i class="bi bi-plus-lg me-1"></i> Добавить модуль
        </button>
    </div>

    <div class="modal-footer px-0 pb-0 d-flex justify-content-between align-items-center">
        <div>
            <div id="modules-save-spinner" class="spinner-border spinner-border-sm text-primary htmx-indicator" role="status"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check2 me-1"></i>Сохранить модули
            </button>
        </div>
    </div>
</form>
