<!-- ========================================================= -->
<!-- ============ SIDEBAR: ФИЛЬТР ПО ТЕМАМ =================== -->
<!-- ========================================================= -->

<div class="d-flex flex-column align-items-stretch flex-shrink-0 bg-secondary p-2 text-dark bg-opacity-10 sticky-md-top rounded shadow-sm">
  <div class="d-flex align-items-center justify-content-between p-3 link-dark text-decoration-none border-bottom">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-stack fs-5"></i>
      <span class="fs-5 fw-semibold">Темы</span>
    </div>
    <button type="button" 
            class="btn btn-sm btn-link text-decoration-none p-0 text-muted"
            x-show="selected_subjects.length > 0"
            @click="resetSubjects()"
            style="display: none;">
      Сбросить
    </button>
  </div>

  <div class="list-group list-group-flush border-bottom scrollarea mt-2">
    {# Кнопка 'Все' #}
    <button type="button"
            class="list-group-item list-group-item-action py-3 lh-tight text-start border-0 rounded mb-1"
            :class="selected_subjects.length === 0 ? 'active' : ''"
            @click="resetSubjects()">
      <div class="d-flex w-100 align-items-center justify-content-between">
        <strong class="mb-1">Все</strong>
      </div>
      <div class="small">
        Все последние курсы.
      </div>
    </button>

    {# Список тем с мультиселектом на Alpine #}
    {% for s in subjects %}
      <button type="button"
              class="list-group-item list-group-item-action py-3 lh-tight text-start border-0 rounded mb-1"
              :class="selected_subjects.includes('{{ s.slug }}') ? 'active' : ''"
              @click="toggleSubject('{{ s.slug }}')">
        <div class="d-flex w-100 align-items-center justify-content-between">
          <strong class="mb-1">{{ s.title }}</strong>
        </div>
        <div class="small">
          Количество курсов: {{ s.total_courses }}.
        </div>
      </button>
    {% empty %}
      <div class="p-3 text-muted small">
        Темы не найдены
      </div>
    {% endfor %}
  </div>
</div>
