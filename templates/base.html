{% load static %}
<!DOCTYPE html>
<html class="h-100">
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <title>{% block title %}Платформа для обучения{% endblock title %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css">

  <!-- HTMX (AJAX-запросы, частичная перезагрузка DOM без SPA-раздутия) -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- Alpine.js (клиентская реактивность: модалки, дропдауны, аккордеоны) -->
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>

  <!-- jquery (сохранен для совместимости) -->
  <script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>

  <!-- custom css -->
  <link rel="stylesheet" href="{% static 'css/option.css' %}">
  <!-- <link rel="stylesheet" href="{% static 'css/base.css' %}"> -->
</head>

<!-- hx-headers автоматически прокидывает CSRF-токен Django во все POST-запросы HTMX -->
<body class="d-flex flex-column h-100" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <main>
        <div class="container">
            {% include "navbar.html" %}
            {% block content %}
            {% endblock content %}
        </div>
    </main>
  {% include "footer.html" %}
  {% block include_js %}
  {% endblock %}

  <!-- Bootstrap JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      // DOM DOMContentLoaded
      {% block domready %}
      {% endblock %}
    })
  </script>
</body>
</html>
